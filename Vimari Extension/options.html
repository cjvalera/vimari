<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vimari Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1>Vimari Settings</h1>
      <p>Edit Vimari’s JSON configuration. Changes apply to open pages immediately.</p>
    </header>

    <label for="settingsEditor">Configuration</label>
    <textarea id="settingsEditor" spellcheck="false" aria-describedby="status"></textarea>

    <div class="actions">
      <button id="saveButton" class="primary" type="button">Save</button>
      <button id="importButton" type="button">Import JSON…</button>
      <button id="exportButton" type="button">Export JSON</button>
      <button id="resetButton" class="danger" type="button">Reset Defaults</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
