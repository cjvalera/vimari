<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Vimkit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3A"/>
      <stop offset="0.55" stop-color="#141A24"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BF0A5"/>
      <stop offset="1" stop-color="#25C374"/>
    </linearGradient>
  </defs>

  <!-- squircle body -->
  <rect x="100" y="92" width="824" height="824" rx="188" ry="188" fill="url(#bg)"/>
  <rect x="103" y="95" width="818" height="818" rx="185" ry="185" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- prompt chevron -->
  <polyline points="349,358 489,504 349,650" fill="none" stroke="#E8EFF6"
            stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- block cursor -->
  <rect x="575" y="400" width="140" height="228" rx="34" ry="34" fill="url(#cursor)"/>
</svg>
